<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="shortcut icon" type="image/jpg" href="https://cdn-icons-png.freepik.com/512/8469/8469896.png"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: rgba(255, 0, 0, 0.533);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        h1 {
            font-size: 4em;
        }

        #txt {
            font-size: 6em;
        }

        .website {
            margin-top: 30px;
            font-size: 2em;
            color: rgba(255, 0, 0, 0.533);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="txt">Loading...</h1>
        <div class="website">
            <a href="https://rolesvilletime.com">Back to Home</a>
            <br></br>
            <p id="lunchA">A Lunch: 10:27 AM - 11:07 AM</p>
            <p id="lunchB">B Lunch: 12:07 PM - 12:47 PM</p>
        </div>
    </div>

    <script>
        let offsetSecs = 45;

        function update() {
            let now = new Date();
            now.setSeconds(now.getSeconds() + offsetSecs);
            let nxt = getNext();
            let diff = nxt.date - now;

            diff = Math.floor(diff / 1000);
            let secs = diff % 60;
            diff = Math.floor(diff / 60);
            let mins = diff % 60;
            diff = Math.floor(diff / 60);
            let hrs = diff;

            let timestr = `${(hrs === 0 ? "" : hrs.toString().padStart(2, '0') + ":")}${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.getElementById("txt").innerText = `${timestr} left of ${nxt.name}`;
            document.title = `${timestr}`;
            
            updateLunchTimes(now);
        }
        
        function formatTime(diffMs) {
            let totalSeconds = Math.floor(diffMs / 1000);
            let hrs = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = totalSeconds % 60;
            
            if (hrs > 0) {
                return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }
        
        function updateLunchTimes(now) {
            // A Lunch: 10:27 - 11:07
            let aLunchStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 27);
            let aLunchEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 11, 7);
            
            // If lunch has passed today, check tomorrow
            if (now >= aLunchEnd) {
                aLunchStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 10, 27);
                aLunchEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 11, 7);
            }
            
            let aLunchText = "A Lunch: 10:27 AM - 11:07 AM";
            if (now >= aLunchStart && now < aLunchEnd) {
                let remaining = formatTime(aLunchEnd - now);
                aLunchText += ` (${remaining} Remaining)`;
            } else {
                let until = formatTime(aLunchStart - now);
                aLunchText += ` (In ${until})`;
            }
            document.getElementById("lunchA").innerText = aLunchText;
            
            // B Lunch: 12:07 - 12:47
            let bLunchStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 7);
            let bLunchEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 47);
            
            // If lunch has passed today, check tomorrow
            if (now >= bLunchEnd) {
                bLunchStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12, 7);
                bLunchEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12, 47);
            }
            
            let bLunchText = "B Lunch: 12:07 PM - 12:47 PM";
            if (now >= bLunchStart && now < bLunchEnd) {
                let remaining = formatTime(bLunchEnd - now);
                bLunchText += ` (${remaining} Remaining)`;
            } else {
                let until = formatTime(bLunchStart - now);
                bLunchText += ` (In ${until})`;
            }
            document.getElementById("lunchB").innerText = bLunchText;
        }

        function getNext() {
            let now = new Date();
            now.setSeconds(now.getSeconds() + offsetSecs);

            let arr = [
                {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 7, 25),
                    name: "Before School"
                }, {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 56),
                    name: "1st Period"
                }, {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 27),
                    name: "2nd Period"
                }, {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 47),
                    name: "3rd Period"
                }, {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 14, 18),
                    name: "4th Period"
                }
            ];

            let nextEvent = arr.find(event => event.date > now);

            if (!nextEvent) {
                nextEvent = {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 7, 25),
                    name: "Before School"
                };
            }

            return nextEvent;
        }

        update();
        setInterval(() => update(), 1000);
    </script>
</body>
</html>

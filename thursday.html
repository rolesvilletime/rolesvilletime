<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="shortcut icon" type="image/jpg" href="https://cdn-icons-png.freepik.com/512/8469/8469896.png"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: rgba(255, 0, 0, 0.533);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        h1 {
            font-size: 4em;
        }

        #txt {
            font-size: 6em;
        }

        .website {
            margin-top: 30px;
            font-size: 2em;
            color: rgba(255, 0, 0, 0.533);
        }

        .button-container {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.5em;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
            margin: 0 5px;
        }

        button:hover {
            background-color: darkred;
        }

        button.selected {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="txt">Loading...</h1>
        <div class="website">
            <a href="https://rolesvilletime.com">Back to Home</a>
            <br></br>
            <p>A Lunch: 10:27 AM - 10:57 AM</p>
            <p>B Lunch: 11:12 AM - 11:52 AM</p>
            <p>C Lunch: 12:02 PM - 12:42 PM</p>
        </div>
        <div class="button-container">
            <button onclick="selectLunch('A')" id="lunchA">A Lunch</button>
            <button onclick="selectLunch('B')" id="lunchB">B Lunch</button>
            <button onclick="selectLunch('C')" id="lunchC">C Lunch</button>
            <button onclick="selectLunch('none')" id="lunchNone">No Lunch</button>
        </div>
    </div>

    <script>
        let offsetSecs = 45;
        let selectedLunch = 'none';

        function selectLunch(lunch) {
            selectedLunch = lunch;
            // Reset all buttons
            document.getElementById('lunchA').classList.remove('selected');
            document.getElementById('lunchB').classList.remove('selected');
            document.getElementById('lunchC').classList.remove('selected');
            document.getElementById('lunchNone').classList.remove('selected');
            
            // Highlight selected button
            if (lunch !== 'none') {
                document.getElementById('lunch' + lunch).classList.add('selected');
            } else {
                document.getElementById('lunchNone').classList.add('selected');
            }
        }

        function update() {
            let now = new Date();
            now.setSeconds(now.getSeconds() + offsetSecs);
            let nxt = getNext();
            let diff = nxt.date - now;

            diff = Math.floor(diff / 1000);
            let secs = diff % 60;
            diff = Math.floor(diff / 60);
            let mins = diff % 60;
            diff = Math.floor(diff / 60);
            let hrs = diff;

            let timestr = `${(hrs === 0 ? "" : hrs.toString().padStart(2, '0') + ":")}${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.getElementById("txt").innerText = `${timestr} left of ${nxt.name}`;
            document.title = `${timestr}`;
        }

        function getNext() {
            let now = new Date();
            now.setSeconds(now.getSeconds() + offsetSecs);

            let arr = [
                {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 7, 25),
                    name: "Before School"
                }, {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 56),
                    name: "1st Period"
                }, {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 27),
                    name: "2nd Period"
                }
            ];

            // Add lunch periods based on selection
            if (selectedLunch === 'A') {
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 27),
                    name: "A Lunch"
                });
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 10, 57),
                    name: "3rd Period"
                });
            } else if (selectedLunch === 'B') {
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 11, 12),
                    name: "B Lunch"
                });
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 11, 52),
                    name: "3rd Period"
                });
            } else if (selectedLunch === 'C') {
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 2),
                    name: "C Lunch"
                });
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 42),
                    name: "3rd Period"
                });
            } else {
                // No lunch selected - full 3rd period
                arr.push({
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 42),
                    name: "3rd Period"
                });
            }

            arr.push({
                date: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 14, 18),
                name: "4th Period"
            });

            let nextEvent = arr.find(event => event.date > now);

            if (!nextEvent) {
                nextEvent = {
                    date: new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 7, 25),
                    name: "Before School"
                };
            }

            return nextEvent;
        }

        // Initialize with no lunch selected
        selectLunch('none');
        setInterval(() => update(), 1000);
    </script>
</body>
</html>
